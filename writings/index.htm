<script>
window.onload = () => {
  const container = document.getElementById('content');
  const mathBlocks = [];

  // 1. Isola la sintassi MathJax
  let md = document.getElementById('markdown-source').innerHTML.replace(/(\$\$[\s\S]+?\$\$|\$[^\$]+?\$)/g, m => {
    mathBlocks.push(m);
    return `%%MATH_${mathBlocks.length - 1}%%`;
  });

  // 2. Parsing con marked standard
  let html = marked.parse(md);

  // 3. Ripristina MathJax
  html = html.replace(/%%MATH_(\d+)%%/g, (_, i) => 
    mathBlocks[i].replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
  );

  // 4. Assegna gli id {#...} a qualsiasi tag HTML generato (<p>, <h1>, etc.) e apre i link in una nuova scheda
  container.innerHTML = html
    .replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ')
    .replace(/<([^>]+)>([\s\S]*?)\{#(.+?)\}([\s\S]*?)<\/\1>/g, '<$1 id="$3">$2$4</$1>');

  // 5. Rendering MathJax e Scroll all'anchor
  if (window.MathJax?.typesetPromise) {
    MathJax.typesetPromise([container]).then(() => {
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    });
  }
};
</script>
